<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Change Password - Splash &amp; Dash</title>
    <link rel="stylesheet" href="css/base.css">
    <script src="js/portal-auth.js"></script>
    <script>Portal.requireRole();</script>
</head>
<body class="auth-page">

    <!--
        Used by BOTH roles: shown automatically after a first login with a temporary password,
        and from "Change Password" in the staff and admin header.

        Connected to the API: POST /api/auth/change-password (minimum 8 characters).
        When the API starts returning mustChangePassword, it will also need to be cleared on success.
    -->

    <main class="auth-container">
        <div class="auth-card">
            <h1>Set a New Password</h1>
            <p>Choose a password that only you know.</p>

            <p class="form-hint">
                If this is your first login you are using a temporary password. Please change it now.
            </p>

            <div class="error-message" id="password-error" role="alert" hidden></div>
            <div class="success-message" id="password-success" role="status" hidden
                 style="background:#e6f4ea;color:#1e6b34;border:1px solid #b7dfc2;padding:10px 12px;border-radius:6px;margin-bottom:12px;"></div>

            <form id="password-form" novalidate>

                <div class="form-group">
                    <label for="current-password">Current (or temporary) password</label>
                    <input
                        type="password"
                        id="current-password"
                        name="current_password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>

                <button type="submit" id="password-button">Save Password</button>

            </form>

            <a class="back-link" href="javascript:history.back()">Go back</a>
        </div>
    </main>

    <script>
        (function () {
            var form = document.getElementById("password-form");
            var errorBox = document.getElementById("password-error");
            var successBox = document.getElementById("password-success");
            var button = document.getElementById("password-button");

            function showError(message) {
                successBox.hidden = true;
                errorBox.textContent = message;
                errorBox.hidden = false;
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                errorBox.hidden = true;
                successBox.hidden = true;

                var current = document.getElementById("current-password").value;
                var next = document.getElementById("new-password").value;
                var confirm = document.getElementById("confirm-password").value;

                if (!current || !next || !confirm) {
                    showError("Please fill in all three fields.");
                    return;
                }
                if (next.length < 8) {
                    showError("New password must contain at least 8 characters.");
                    return;
                }
                if (next !== confirm) {
                    showError("The new passwords do not match.");
                    return;
                }
                if (next === current) {
                    showError("Your new password must be different.");
                    return;
                }

                button.disabled = true;
                button.textContent = "Saving...";

                try {
                    await Portal.post("/auth/change-password", {
                        currentPassword: current,
                        newPassword: next
                    });

                    form.reset();
                    successBox.textContent = "Password changed. Taking you to your dashboard...";
                    successBox.hidden = false;

                    var account = Portal.getAccount();
                    setTimeout(function () {
                        window.location.href = Portal.homeFor(account.role);
                    }, 1200);
                } catch (err) {
                    showError(err.message);
                    button.disabled = false;
                    button.textContent = "Save Password";
                }
            });
        })();
    </script>

</body>
</html>
