<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Staff Login - Splash &amp; Dash</title>
    <link rel="stylesheet" href="css/base.css">
    <script src="js/portal-auth.js"></script>
</head>
<body class="auth-page">

    <!--
        STAFF AND ADMIN LOGIN ONLY. Customers do not log in on the website - they use the mobile app.
        This page is NOT linked from the public site. Staff reach it through a hidden trigger (to be decided).

        Connected to the API: POST /api/auth/login (see the script at the bottom of this page).
          - Staff can sign in with their username or their email address.
          - Deactivated accounts are refused by the API.
          - role = Admin (includes Super Admins) -> "admin - dashboard.html"
          - role = Staff                         -> "staff - dashboard.html"
          - Changing a password is optional; it is done from edit-profile.html.
    -->

    <main class="auth-container">
        <div class="auth-card">
            <h1>Staff Login</h1>
            <p>Splash &amp; Dash staff and admin portal.</p>

            <div class="error-message" id="login-error" role="alert" hidden></div>

            <form id="login-form" novalidate>

                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" id="login-button">Login</button>

                <!-- Shown if the server is slow to answer (it sleeps when idle). -->
                <p id="login-status" role="status" hidden>
                    Still connecting - the server may be starting up. This can take up to a minute.
                </p>

            </form>

            <a class="back-link" href="index.html">&larr; Back to website</a>
        </div>
    </main>

    <script>
        (function () {
            var form = document.getElementById("login-form");
            var errorBox = document.getElementById("login-error");
            var statusBox = document.getElementById("login-status");
            var button = document.getElementById("login-button");

            function showError(message) {
                errorBox.textContent = message;
                errorBox.hidden = false;
            }

            // Already logged in? Skip the form.
            var existing = Portal.getAccount();
            if (existing && (existing.role === "Admin" || existing.role === "Staff")) {
                // requireRole() clears a stale/expired session and sends back here, so only redirect when valid.
                if (Portal.requireRole()) {
                    window.location.replace(Portal.homeFor(existing.role));
                }
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                errorBox.hidden = true;

                var username = document.getElementById("username").value.trim();
                var password = document.getElementById("password").value;

                if (!username || !password) {
                    showError("Please enter your username (or email) and password.");
                    return;
                }

                button.disabled = true;
                button.textContent = "Logging in...";

                // If the server is asleep, tell the user why it is taking a while.
                var slowTimer = setTimeout(function () {
                    statusBox.hidden = false;
                }, 4000);

                try {
                    var account = await Portal.login(username, password);
                    window.location.href = Portal.homeFor(account.role);
                } catch (err) {
                    showError(err.message);
                    button.disabled = false;
                    button.textContent = "Login";
                } finally {
                    clearTimeout(slowTimer);
                    statusBox.hidden = true;
                }
            });
        })();
    </script>

</body>
</html>
